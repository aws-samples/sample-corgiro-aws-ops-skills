<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="vx-title vx-desc">
  <title id="vx-title">NAT Gateway path versus VPC endpoint path in {{REGION}}</title>
  <desc id="vx-desc">Red: a workload in a private subnet in AZ-c reaches an in-region AWS service through a NAT Gateway in AZ-b and the internet gateway, paying cross-AZ, NAT processing and public-IP transfer. Blue: the same workload reaches the service through an interface VPC endpoint in its own subnet, paying endpoint data processing plus endpoint hours.</desc>
  <defs>
    <marker id="vx-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="vx-arrow-red" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="vx-ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="vx-arrow-blue" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Region / VPC / AZs -->
  <rect class="vx-box vx-dash" x="8" y="8" width="984" height="544" rx="10"/>
  <text class="vx-label" x="22" y="30">AWS Region {{REGION}}</text>
  <rect class="vx-box" x="24" y="44" width="660" height="496" rx="8"/>
  <text class="vx-label" x="36" y="66">VPC</text>

  <rect class="vx-box vx-dash" x="40" y="80" width="200" height="448" rx="6"/>
  <rect class="vx-box vx-dash" x="255" y="80" width="200" height="448" rx="6"/>
  <rect class="vx-box vx-dash" x="470" y="80" width="200" height="448" rx="6"/>
  <text class="vx-small" x="50" y="98">AZ-a</text>
  <text class="vx-small" x="265" y="98">AZ-b</text>
  <text class="vx-small" x="480" y="98">AZ-c</text>

  <rect class="vx-pub" x="48" y="106" width="184" height="140" rx="4"/>
  <rect class="vx-pub" x="263" y="106" width="184" height="140" rx="4"/>
  <rect class="vx-pub" x="478" y="106" width="184" height="140" rx="4"/>
  <rect class="vx-priv" x="48" y="264" width="184" height="252" rx="4"/>
  <rect class="vx-priv" x="263" y="264" width="184" height="252" rx="4"/>
  <rect class="vx-priv" x="478" y="264" width="184" height="252" rx="4"/>
  <text class="vx-small" x="56" y="122">Public subnet</text>
  <text class="vx-small" x="271" y="122">Public subnet</text>
  <text class="vx-small" x="486" y="122">Public subnet</text>
  <text class="vx-small" x="56" y="280">Private subnet</text>
  <text class="vx-small" x="271" y="280">Private subnet</text>
  <text class="vx-small" x="486" y="280">Private subnet</text>

  <!-- Nodes -->
  <circle class="vx-node" cx="355" cy="44" r="20"/><text class="vx-node-text" x="355" y="48">IGW</text>
  <rect class="vx-node" x="315" y="166" width="80" height="40" rx="8"/><text class="vx-node-text" x="355" y="190">NAT GW</text>
  <rect class="vx-ec2" x="88" y="378" width="44" height="44" rx="4"/><text class="vx-ec2-text" x="110" y="404">EC2</text>
  <rect class="vx-ec2" x="303" y="378" width="44" height="44" rx="4"/><text class="vx-ec2-text" x="325" y="404">EC2</text>
  <rect class="vx-ec2" x="518" y="378" width="44" height="44" rx="4"/><text class="vx-ec2-text" x="540" y="404">EC2</text>
  <circle class="vx-vpce" cx="180" cy="400" r="20"/><text class="vx-node-text" x="180" y="404">VPCE</text>
  <circle class="vx-vpce" cx="395" cy="400" r="20"/><text class="vx-node-text" x="395" y="404">VPCE</text>
  <circle class="vx-vpce" cx="615" cy="400" r="20"/><text class="vx-node-text" x="615" y="404">VPCE</text>

  <rect class="vx-svc" x="712" y="150" width="264" height="200" rx="8"/>
  <text class="vx-label" x="964" y="174" text-anchor="end">AWS service public endpoint</text>
  <text class="vx-small" x="964" y="192" text-anchor="end">same region, e.g. S3, ECR, STS</text>
  <rect class="vx-node" x="800" y="236" width="90" height="40" rx="8"/><text class="vx-node-text" x="845" y="260">Service</text>

  <!-- Current path (red): EC2 AZ-c -> NAT GW AZ-b -> IGW -> service -->
  <path class="vx-path-red" d="M528 376 C 500 300, 430 250, 380 210" marker-end="url(#vx-ar)"/>
  <path class="vx-path-red" d="M355 164 L 355 68" marker-end="url(#vx-ar)"/>
  <path class="vx-path-red" d="M375 40 C 560 0, 720 120, 802 238" marker-end="url(#vx-ar)"/>

  <g class="vx-hop-red"><circle cx="502" cy="320" r="10"/><text x="502" y="324">1</text></g>
  <text class="vx-op-red" x="516" y="318">InterZone-Out</text><text class="vx-price" x="516" y="332">{{P_XAZ}}</text>
  <g class="vx-hop-red"><circle cx="425" cy="250" r="10"/><text x="425" y="254">2</text></g>
  <text class="vx-op-red" x="411" y="248" text-anchor="end">InterZone-In</text><text class="vx-price" x="411" y="262" text-anchor="end">{{P_XAZ}}</text>
  <g class="vx-hop-red"><circle cx="300" cy="140" r="10"/><text x="300" y="144">3</text></g>
  <text class="vx-op-red" x="160" y="148">NatGateway-Bytes</text><text class="vx-price" x="160" y="162">{{P_NAT}}</text>
  <g class="vx-hop-red"><circle cx="560" cy="44" r="10"/><text x="560" y="48">4</text></g>
  <text class="vx-op-red" x="574" y="40">PublicIP-Out / PublicIP-In</text><text class="vx-price" x="574" y="54">{{P_RDT}} (one per GB, by direction)</text>

  <!-- Proposed path (blue): EC2 AZ-c -> VPCE in the same subnet -> service -->
  <path class="vx-path-blue" d="M564 400 L 593 400" marker-end="url(#vx-ab)"/>
  <path class="vx-path-blue" d="M636 392 C 690 370, 760 330, 830 280" marker-end="url(#vx-ab)"/>
  <g class="vx-hop-blue"><circle cx="700" cy="362" r="10"/><text x="700" y="366">5</text></g>
  <text class="vx-op-blue" x="714" y="378">VpcEndpoint-Bytes</text><text class="vx-price" x="714" y="392">{{P_EP_GB}}</text>
  <g class="vx-hop-blue"><circle cx="615" cy="446" r="10"/><text x="615" y="450">6</text></g>
  <text class="vx-op-blue" x="560" y="474">VpcEndpoint-Hours</text><text class="vx-price" x="560" y="488">{{P_EP_HR}}</text>
  <text class="vx-small" x="560" y="503">per endpoint, per AZ (x3 AZs shown)</text>
</svg>
